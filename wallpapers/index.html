<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#070b10"><title>幻光壁纸 · 随光而动</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"></head><body>
<main class="shell"><section class="preview" aria-label="壁纸实时预览"><canvas id="wallpaper" aria-label="可拖动的动态壁纸"></canvas><div class="preview-top"><span>幻光壁纸<small>LIGHT, WITH YOU.</small></span><button id="immersive" aria-label="切换沉浸预览">⛶</button></div><div class="lock-overlay"><p id="date"></p><div id="clock">12:30</div></div><div class="scene-caption"><span class="eyebrow">一帧光影 · 一份珍藏</span><h1 id="title">元瑶</h1><p id="subtitle">你只管做你想做的</p></div><div class="preview-bottom"><span id="status" role="status">正在准备光影…</span><span>拖动屏幕，感受视差</span></div></section>
<aside class="panel"><header><span class="eyebrow">YOUR PRIVATE COLLECTION</span><h2>让光，住进屏幕。</h2><p>挑一幅喜欢的画，轻轻转动手机。</p></header><nav class="library" id="library" aria-label="壁纸收藏"></nav>
<section class="settings"><div class="section-title"><h3>光影调校</h3><button id="reset">恢复默认</button></div><label>幻光强度 <output id="foil-value">55%</output><input id="foil" type="range" min="0" max="1.2" step="0.01" value="0.55"></label><label>视差深度 <output id="depth-value">50%</output><input id="depth" type="range" min="0" max="0.4" step="0.01" value="0.2"></label><div class="setting-row"><span>画面构图</span><select id="composition"><option value="0">保留完整场景</option><option value="1">铺满屏幕</option></select></div><div class="setting-row"><span>保留卡面文字</span><input id="text-toggle" type="checkbox" aria-label="保留卡面文字"></div><div class="setting-row"><span>省电模式</span><input id="eco" type="checkbox" checked aria-label="省电模式"></div><div class="setting-row"><span>显示锁屏时钟预览</span><input id="clock-toggle" type="checkbox" checked aria-label="显示锁屏时钟预览"></div><button class="motion" id="motion">开启重力感应 ↗</button></section>
<div class="apply-actions"><button class="primary" id="apply">设为壁纸</button><button id="save">保存静态画面</button></div><p class="platform-note" id="platform-note">Android 可应用为动态壁纸。iPhone 可在 App 中交互，系统壁纸需要导出后设置。</p>
<details class="connection"><summary>我的素材库</summary><label>后台服务地址<input id="api" type="url" placeholder="https://你的后台域名" autocomplete="url"></label><button id="connect">连接素材库</button><button id="local">使用随附示例</button><p>手机只下载并展示已完成的作品。</p></details><p class="footnote">原型 0.1 · 元瑶 / 水墨锦鲤</p></aside></main>
<dialog id="instructions"><button id="close" aria-label="关闭">×</button><h2 id="dialog-title">将光影留在桌面</h2><p id="dialog-body"></p><button id="dialog-done">知道了</button></dialog><script type="module" src="./app.js"></script></body></html>
